###############################################################################
# GitHub Actions: Terraform Destroy
# MANUAL ONLY — requires environment approval
# Use for decommissioning requests from ServiceNow
###############################################################################

name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options: [dev, staging]  # prod deliberately excluded
      ticket_id:
        description: "ServiceNow decommission ticket ID"
        required: true
      confirm:
        description: "Type DESTROY to confirm"
        required: true

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "us-east-1"

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-destroy  # Requires separate approval env

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "❌ Confirmation text does not match. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: "GitHubActions-Destroy-${{ github.run_id }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy Plan
        working-directory: terraform/environments/${{ inputs.environment }}
        run: |
          terraform plan -destroy \
            -var="acm_certificate_arn=${{ secrets.ACM_CERTIFICATE_ARN }}" \
            -var="access_logs_bucket=${{ secrets.ACCESS_LOGS_BUCKET }}" \
            -var="artifact_bucket_name=${{ secrets.ARTIFACT_BUCKET }}" \
            -var="tf_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="servicenow_ticket_id=${{ inputs.ticket_id }}" \
            -out=destroy.tfplan

      - name: Terraform Destroy Apply
        working-directory: terraform/environments/${{ inputs.environment }}
        run: terraform apply -auto-approve destroy.tfplan

      - name: Destroy summary
        if: always()
        run: |
          echo "## Destroy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ticket | ${{ inputs.ticket_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroyed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
