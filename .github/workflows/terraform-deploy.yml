###############################################################################
# terraform-deploy.yml
# Runs terraform plan on every PR, terraform apply on merge to main.
# Uses GitHub OIDC → AWS (no long-lived keys).
#
# Required GitHub secrets:
#   AWS_ROLE_ARN          — IAM role ARN with OIDC trust (created by iam module)
#   TF_STATE_BUCKET       — S3 bucket for Terraform state
#   SERVICENOW_INSTANCE_URL
#   SERVICENOW_USERNAME
#   SERVICENOW_PASSWORD
#   GITHUB_TOKEN_SECRET   — PAT for deployment_trigger lambda (not the built-in GITHUB_TOKEN)
#   WEBHOOK_SECRET
#
# Usage:
#   Trigger manually via workflow_dispatch, selecting the week and environment.
#   PRs to main auto-run plan. Merges to main auto-run apply.
###############################################################################

name: Terraform Deploy

on:
  push:
    branches: [main]
    paths:
      - "week-*/terraform/**"
  pull_request:
    branches: [main]
    paths:
      - "week-*/terraform/**"
  workflow_dispatch:
    inputs:
      week:
        description: "Week folder (e.g. week-01-enterprise-ec2-provisioning)"
        required: true
        type: string
      environment:
        description: "Environment"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      action:
        description: "Terraform action"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write   # Required for OIDC token
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.0"
  AWS_REGION: "us-east-1"

jobs:
  # ── Detect which week changed (for push/PR triggers) ──────────────────────
  detect-changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      weeks: ${{ steps.changed.outputs.weeks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed week folders
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD \
            | grep '^week-' \
            | cut -d'/' -f1 \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "weeks=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed weeks: $CHANGED"

  # ── Plan (PR) ──────────────────────────────────────────────────────────────
  plan:
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        week: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.week)) || fromJson(needs.detect-changes.outputs.weeks) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ matrix.week }}/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        run: terraform init -reconfigure

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.week }}/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        env:
          TF_VAR_servicenow_instance_url: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          TF_VAR_servicenow_username: ${{ secrets.SERVICENOW_USERNAME }}
          TF_VAR_servicenow_password: ${{ secrets.SERVICENOW_PASSWORD }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN_SECRET }}
          TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          terraform plan -no-color 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ matrix.week }}/terraform/environments/${{ github.event.inputs.environment || 'dev' }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — \`${{ matrix.week }}\`\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  # ── Apply (merge to main) ──────────────────────────────────────────────────
  apply:
    needs: detect-changes
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production   # Requires manual approval in GitHub Environments settings
    strategy:
      matrix:
        week: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.week)) || fromJson(needs.detect-changes.outputs.weeks) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ matrix.week }}/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        run: terraform init -reconfigure

      - name: Terraform Apply
        working-directory: ${{ matrix.week }}/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
        env:
          TF_VAR_servicenow_instance_url: ${{ secrets.SERVICENOW_INSTANCE_URL }}
          TF_VAR_servicenow_username: ${{ secrets.SERVICENOW_USERNAME }}
          TF_VAR_servicenow_password: ${{ secrets.SERVICENOW_PASSWORD }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN_SECRET }}
          TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform apply -auto-approve

  # ── Destroy (manual only — safety gate) ──────────────────────────────────
  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ inputs.week }}/terraform/environments/${{ inputs.environment }}
        run: terraform init -reconfigure

      - name: Terraform Destroy
        working-directory: ${{ inputs.week }}/terraform/environments/${{ inputs.environment }}
        env:
          TF_VAR_servicenow_instance_url: "https://dummy.service-now.com"
          TF_VAR_servicenow_username: "dummy"
          TF_VAR_servicenow_password: "dummy"
          TF_VAR_github_token: "dummy"
          TF_VAR_webhook_secret: "dummy"
          TF_VAR_tf_state_bucket: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform destroy -auto-approve
