###############################################################################
# GitHub Actions: Terraform Destroy — Week 3 SSM Fleet Management
# MANUAL ONLY — type DESTROY to confirm
###############################################################################

name: "Week 3 — Destroy SSM Fleet Management"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options: [dev, staging]
      ticket_id:
        description: "ServiceNow ticket ID (or 'manual')"
        required: true
      confirm:
        description: "Type DESTROY to confirm"
        required: true

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "us-east-1"
  WEEK_DIR:   "week-03-ssm-fleet-management"

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation text does not match. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: "GitHubActions-Destroy-${{ github.run_id }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: |
          terraform destroy -auto-approve \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}" \
            -var="servicenow_instance_url=${{ secrets.SERVICENOW_INSTANCE_URL }}" \
            -var="servicenow_username=${{ secrets.SERVICENOW_USERNAME }}" \
            -var="servicenow_password=${{ secrets.SERVICENOW_PASSWORD }}"

      - name: Delete CloudWatch log groups
        run: |
          ENV="${{ inputs.environment }}"
          for LOG_GROUP in \
            "/aws/lambda/ssm-fleet-${ENV}-webhook-receiver" \
            "/aws/lambda/ssm-fleet-${ENV}-fleet-onboarder" \
            "/aws/lambda/ssm-fleet-${ENV}-patch-orchestrator" \
            "/aws/lambda/ssm-fleet-${ENV}-status-updater" \
            "/aws/states/ssm-fleet-${ENV}-fleet-management" \
            "/aws/ssm/ssm-fleet-${ENV}/sessions"; do
            aws logs delete-log-group \
              --log-group-name "$LOG_GROUP" \
              --region ${{ env.AWS_REGION }} 2>/dev/null \
              && echo "Deleted: $LOG_GROUP" \
              || echo "Not found (OK): $LOG_GROUP"
          done

      - name: Destroy summary
        if: always()
        run: |
          echo "## Week 3 Destroy Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ticket | ${{ inputs.ticket_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroyed by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
