###############################################################################
# GitHub Actions: Week 04 — Glue Fleet Intelligence Platform Deploy
# OIDC auth (no static AWS credentials)
###############################################################################

name: Week 04 — Deploy Fleet Intelligence

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev]

env:
  TF_VERSION: "1.10.0"
  AWS_REGION: "us-east-1"
  TF_WORK_DIR: "week-04-glue-fleet-intelligence/terraform/environments/dev"
  RAW_BUCKET:  "jay-fleet-intelligence-raw-dev"

jobs:
  deploy:
    name: "Plan + Apply"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: "GitHubActions-Week04-${{ github.run_id }}"

      # ── Build Lambda zips ────────────────────────────────────────────────────
      - name: Build Lambda packages
        working-directory: week-04-glue-fleet-intelligence
        run: |
          for fn in webhook_receiver glue_trigger status_updater; do
            cd lambda/$fn
            zip -q "${fn}.zip" handler.py
            echo "Packaged $fn.zip"
            cd ../..
          done

      # ── Terraform ────────────────────────────────────────────────────────────
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORK_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORK_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORK_DIR }}
        run: |
          terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="servicenow_instance=${{ secrets.SERVICENOW_INSTANCE }}" \
            -var="servicenow_username=${{ secrets.SERVICENOW_USERNAME }}" \
            -var="servicenow_password=${{ secrets.SERVICENOW_PASSWORD }}" \
            -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}" \
            -out=tfplan

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORK_DIR }}
        run: |
          terraform apply -auto-approve tfplan
          echo "api_url=$(terraform output -raw api_gateway_url)"        >> $GITHUB_OUTPUT
          echo "crawler=$(terraform output -raw crawler_name)"           >> $GITHUB_OUTPUT
          echo "etl_job=$(terraform output -raw etl_job_name)"           >> $GITHUB_OUTPUT
          echo "workgroup=$(terraform output -raw athena_workgroup)"     >> $GITHUB_OUTPUT
          echo "sfn_arn=$(terraform output -raw state_machine_arn)"      >> $GITHUB_OUTPUT

      # ── Upload Glue ETL script to S3 ─────────────────────────────────────────
      - name: Upload Glue ETL script
        run: |
          aws s3 cp week-04-glue-fleet-intelligence/glue/scripts/fleet_etl.py \
            s3://${{ env.RAW_BUCKET }}/scripts/fleet_etl.py \
            --region ${{ env.AWS_REGION }}
          echo "Glue ETL script uploaded to s3://${{ env.RAW_BUCKET }}/scripts/fleet_etl.py"

      - name: Deployment summary
        if: always()
        run: |
          echo "## Week 04 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.apply.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Glue Crawler | ${{ steps.apply.outputs.crawler }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ETL Job | ${{ steps.apply.outputs.etl_job }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Athena Workgroup | ${{ steps.apply.outputs.workgroup }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Step Functions ARN | ${{ steps.apply.outputs.sfn_arn }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
