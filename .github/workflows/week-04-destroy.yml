###############################################################################
# GitHub Actions: Week 04 — Glue Fleet Intelligence Platform Destroy
###############################################################################

name: Week 04 — Destroy Fleet Intelligence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm"
        required: true

env:
  TF_VERSION:   "1.10.0"
  AWS_REGION:   "us-east-1"
  TF_WORK_DIR:  "week-04-glue-fleet-intelligence/terraform/environments/dev"

jobs:
  destroy:
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: "GitHubActions-Week04-Destroy-${{ github.run_id }}"

      # Lambda zips must exist for destroy (source_code_hash references them)
      - name: Build Lambda packages
        working-directory: week-04-glue-fleet-intelligence
        run: |
          for fn in webhook_receiver glue_trigger status_updater; do
            cd lambda/$fn
            zip -q "${fn}.zip" handler.py
            cd ../..
          done

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORK_DIR }}
        run: terraform init

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORK_DIR }}
        run: |
          terraform destroy -auto-approve \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="servicenow_instance=${{ secrets.SERVICENOW_INSTANCE }}" \
            -var="servicenow_username=${{ secrets.SERVICENOW_USERNAME }}" \
            -var="servicenow_password=${{ secrets.SERVICENOW_PASSWORD }}" \
            -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}"

      - name: Destroy summary
        if: always()
        run: |
          echo "## Week 04 Destroy Complete" >> $GITHUB_STEP_SUMMARY
          echo "All Week 04 resources destroyed. Cost: \$0" >> $GITHUB_STEP_SUMMARY
