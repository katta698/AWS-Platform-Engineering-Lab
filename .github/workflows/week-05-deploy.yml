###############################################################################
# GitHub Actions: Week 05 — Cost Anomaly Detection Deploy
#
# Auth: HCP Terraform API token (TF_API_TOKEN secret)
#       HCP workspace handles AWS credentials via OIDC dynamic credentials —
#       no AWS_ROLE_ARN or static keys needed here.
#
# State: HCP Terraform — org: Katta | workspace: week-05-dev
# Variables: alert_email + anomaly_threshold live in the HCP workspace
###############################################################################

name: Week 05 — Deploy Cost Anomaly Detection

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev]

env:
  TF_VERSION:  "1.10.5"
  TF_WORK_DIR: "week-05-cost-anomaly-detection/terraform/environments/dev"

jobs:
  deploy:
    name: "Plan + Apply (HCP Terraform)"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORK_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORK_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORK_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORK_DIR }}
        run: |
          terraform apply -auto-approve tfplan
          echo "lambda=$(terraform output -raw lambda_function_name)"      >> $GITHUB_OUTPUT
          echo "raw_sns=$(terraform output -raw raw_sns_topic_arn)"        >> $GITHUB_OUTPUT
          echo "alert_sns=$(terraform output -raw alert_sns_topic_arn)"    >> $GITHUB_OUTPUT
          echo "monitor=$(terraform output -raw anomaly_monitor_arn)"      >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## Week 05 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lambda | ${{ steps.apply.outputs.lambda }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SNS Raw Topic | ${{ steps.apply.outputs.raw_sns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SNS Alert Topic | ${{ steps.apply.outputs.alert_sns }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Anomaly Monitor | ${{ steps.apply.outputs.monitor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Confirm the SNS email subscription in your inbox before testing." >> $GITHUB_STEP_SUMMARY
