###############################################################################
# GitHub Actions: Terraform Deploy — Week 3 SSM Fleet Management
###############################################################################

name: "Week 3 — Deploy SSM Fleet Management"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "us-east-1"
  WEEK_DIR:   "week-03-ssm-fleet-management"

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exit_code }}
      environment:    ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: "GitHubActions-${{ github.run_id }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: |
          set +e
          terraform plan \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
            -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}" \
            -var="servicenow_instance_url=${{ secrets.SERVICENOW_INSTANCE_URL }}" \
            -var="servicenow_username=${{ secrets.SERVICENOW_USERNAME }}" \
            -var="servicenow_password=${{ secrets.SERVICENOW_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode
          TF_EXIT=$?
          set -e
          echo "::notice::Terraform plan exit code: $TF_EXIT  (0=no-changes, 1=error, 2=changes-present)"
          echo "exit_code=$TF_EXIT" >> $GITHUB_OUTPUT
          # Exit 1 = terraform error — fail the step; exit 2 = changes present — pass through
          if [ $TF_EXIT -eq 1 ]; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}/tfplan
          retention-days: 1

  apply:
    name: "Terraform Apply"
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    if: needs.plan.outputs.plan_exit_code == '2'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}
          role-session-name: "GitHubActions-Apply-${{ github.run_id }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: terraform init

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.WEEK_DIR }}/terraform/environments/${{ inputs.environment }}
        run: |
          terraform apply -auto-approve tfplan
          echo "api_url=$(terraform output -raw api_gateway_url)"              >> $GITHUB_OUTPUT
          echo "asg=$(terraform output -raw asg_name)"                         >> $GITHUB_OUTPUT
          echo "dashboard=$(terraform output -raw cloudwatch_dashboard_url)"   >> $GITHUB_OUTPUT
          echo "session_bucket=$(terraform output -raw session_logs_bucket)"   >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## Week 3 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.apply.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ASG | ${{ steps.apply.outputs.asg }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Session Logs Bucket | ${{ steps.apply.outputs.session_bucket }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | ${{ steps.apply.outputs.dashboard }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
